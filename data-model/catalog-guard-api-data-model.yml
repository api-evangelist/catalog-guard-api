identifiers:
  id_prefixes: none
  persistent_ids: none
  detail: >-
    No entity has an identifier and nothing is persisted. The `row` index on a Finding is
    positional within the submitted payload and is meaningless outside that one request.
header_contract:
  csv_branch_expects: normalized headers
  required_headers: [supplier_sku, title, price, stock, published]
  detail: >-
    Verified by probe: the csv branch requires normalized column names, not Shopify's own
    product-CSV export headers. A CSV using Shopify's documented headers (Handle, Title,
    Variant SKU, Variant Price, Variant Inventory Qty, Published) is rejected with
    missing_required_field on all five required fields. This mapping requirement is not stated
    in the OpenAPI, the docs endpoint, or the CSV guides.
