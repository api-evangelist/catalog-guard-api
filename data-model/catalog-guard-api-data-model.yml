source: >-
  openapi/catalog-guard-api-catalog-check-openapi.json (request schemas) plus live 200
  responses captured from https://catalogguard.noahcortezj-c.workers.dev/api/v1/catalog/check
  (the response bodies are NOT schematized in the spec — responses carry a description only)
note: >-
  The OpenAPI declares components:{} — no reusable schemas, and every response is described in
  prose with no schema. The response entities below were therefore derived from real observed
  payloads (one rows-input call, one csv-input call with 10 blockers), not from the contract.
  This is the single largest gap in the provider's spec: a consumer cannot generate a response
  type from it.
entities:
