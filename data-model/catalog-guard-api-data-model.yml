  - {name: rows, type: array, max_items: 250, required_in_branch: rows}
  note: additionalProperties false on both branches.
- name: ProductRow
  source: observed
  kind: request-element
  detail: >-
    A flat object of string|number|boolean|null values. The spec does not name the fields; the
    documented required set, from the guides and the diagnostic page, is supplier_sku, title,
    price, stock, published, with vendor, category, weight and tags also recognized.
  fields:
  - {name: supplier_sku, type: string, required: true, note: normalized and compared for collisions across rows}
  - {name: title, type: string, required: true}
  - {name: price, type: string|number, required: true}
  - {name: stock, type: number, required: true}
  - {name: published, type: boolean, required: true}
  - {name: vendor, type: string, required: false}
  - {name: category, type: string, required: false, note: audit-only, never mapped to Shopify taxonomy}
  - {name: weight, type: string|number, required: false, note: ambiguous values are flagged, not coerced}
  - {name: tags, type: string, required: false}
