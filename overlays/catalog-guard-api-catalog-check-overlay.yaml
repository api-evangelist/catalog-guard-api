      column headers (supplier_sku, title, price, stock, published). A CSV using Shopify's own
      documented export headers (Handle, Title, Variant SKU, Variant Price, Variant Inventory
      Qty, Published) is structurally accepted but returns missing_required_field for all five
      required fields on every row.
