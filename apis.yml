name: Catalog Guard API
description: >-
  A bounded, fail-closed catalog preflight and validation service for Shopify-shaped supplier
  product CSVs. Exposes an unauthenticated JSON HTTP API that validates raw CSV text or
  normalized product rows and returns a deterministic result: safe rows, blockers and warnings,
  each finding carrying a row index, field, stable code and message. Ambiguous input is refused
  rather than guessed — unclosed quotes, malformed rows, duplicate headers, duplicate normalized
  SKUs and incomplete variant pairs all become blockers, and supplier categories are treated as
  audit-only rather than mapped to a Shopify taxonomy. The service does not accept file uploads,
  credentials, payment data or store connections, holds no storage, and never imports or modifies
  a catalog; every successful response repeats those disclosures inline as machine-readable
  fields. Access is controlled by input bounds and a best-effort rate limit rather than by
  identity. Commercially it is fronted by a free in-browser CSV preflight, a $149 bounded human
  CSV Diagnostic, and a separate free Shopify store-launch referral path.
